<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoTogetherRides AI Ride Matching Engine</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f9;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        button {
            margin-top: 30px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
        }

        #results {
            margin-top: 35px;
        }

        .card {
            background: #fafafa;
            border-left: 6px solid #2563eb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h2 {
            color: #1f2937;
            margin-bottom: 10px;
        }

        .card p {
            margin: 6px 0;
            color: #4b5563;
        }

        .score {
            margin-top: 12px;
            font-size: 18px;
            font-weight: bold;
            color: green;
        }

        .empty {
            text-align: center;
            color: red;
            margin-top: 25px;
            font-size: 18px;
        }

        @media(max-width:600px){
            body{
                padding:20px;
            }

            .container{
                padding:20px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>🚗 GoTogetherRides AI Ride Matching Engine</h1>

        <p class="subtitle">
            Find the best ride based on your travel preferences
        </p>

        <div class="grid">

            <div>
                <label>Pickup Location</label>

                <input
                    id="pickup"
                    type="text"
                    placeholder="Enter pickup location">
            </div>

            <div>
                <label>Destination</label>

                <input
                    id="destination"
                    type="text"
                    placeholder="Enter destination">
            </div>

            <div>
                <label>Departure Time</label>

                <input
                    id="time"
                    type="text"
                    placeholder="09:00 AM">
            </div>

            <div>
                <label>Gender Preference</label>

                <select id="gender">
                    <option>Any</option>
                    <option>Male</option>
                    <option>Female</option>
                </select>
            </div>

        </div>

        <button onclick="findRide()">
            Find Matching Rides
        </button>

        <div id="results"></div>

    </div>

<script>

async function findRide(){

    const body={

        pickup:document.getElementById("pickup").value,

        destination:document.getElementById("destination").value,

        departure_time:document.getElementById("time").value,

        gender_preference:document.getElementById("gender").value

    };

    const response=await fetch("/match",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(body)

    });

    const data=await response.json();

    const results=document.getElementById("results");

    results.innerHTML="";

    if(data.matches.length===0){

        results.innerHTML="<div class='empty'>No matching rides found.</div>";

        return;

    }

    data.matches.forEach(ride=>{

        results.innerHTML+=`

        <div class="card">

            <h2>${ride.driver_name}</h2>

            <p><strong>Pickup:</strong> ${ride.pickup}</p>

            <p><strong>Destination:</strong> ${ride.destination}</p>

            <p><strong>Departure:</strong> ${ride.departure_time}</p>

            <p><strong>Available Seats:</strong> ${ride.available_seats}</p>

            <p><strong>Price:</strong> ₹${ride.price}</p>

            <div class="score">
                Match Score : ${ride.score}%
            </div>

        </div>

        `;

    });

}

</script>

</body>

</html>
